{% extends "sales/sales.html" %}
{% load static %}

{% block title %}Link a Patient - CarePharm{% endblock %}

{% block popup %}
<div class="popup-overlay">
    <dialog open class="popup">
        <div class="popup-header">
            <span class="stat-bubble"><img src="{% static 'core/images/sale-customer.svg' %}" alt=""></span>
            <div>
                <h2>Link a Patient</h2>
                <p>The sale will appear in this patient's history.</p>
            </div>
            <a href="/sales/" class="popup-close" aria-label="Close"><img src="{% static 'core/images/icon-close.svg' %}" alt=""></a>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="popup-fields">
                <div class="form-field full-width">
                    <label for="{{ form.patient.id_for_label }}">Patient</label>
                    {{ form.patient }}
                    {{ form.patient.errors }}
                </div>
            </div>
            <div class="popup-actions">
                <a href="/sales/" class="secondary-button">Cancel</a>
                <button type="submit" class="primary-button">Link Patient</button>
            </div>
        </form>
    </dialog>
</div>
{% endblock %}
