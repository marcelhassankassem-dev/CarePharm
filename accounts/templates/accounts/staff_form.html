{% extends "core/console.html" %}

{% block title %}{{ heading }} - CarePharm{% endblock %}

{% block console_content %}
<div class="page-heading">
    <div>
        <p class="page-eyebrow">Owner settings</p>
        <h1>{{ heading }}</h1>
        <p class="page-intro">{{ intro }}</p>
    </div>
</div>

<section class="card form-card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="primary-button">{{ button }}</button>
            <a href="/staff/" class="table-link">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
